services:
  postgres:
    image: postgres:16-alpine
    # Demo day: kontainer bangkit sendiri setelah laptop tidur/VM reboot,
    # kecuali dihentikan sengaja (`docker compose stop`).
    restart: unless-stopped
    container_name: mealchain-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mealchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mealchain_local}
      POSTGRES_DB: ${POSTGRES_DB:-mealchain}
    # Port host 15432: 5432 di host sudah dipakai postgres proyek lain
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mealchain} -d ${POSTGRES_DB:-mealchain}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mealchain-network

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mealchain-backend
    depends_on:
      postgres:
        condition: service_healthy
    # Nilai .env dibaca VERBATIM lewat env_file. Sebabnya: SAP_AI_CORE_CLIENT_SECRET
    # memuat karakter `$`, dan interpolasi compose `${VAR}` memotong nilai setelah
    # `$` (terukur: 81 char di .env → 37 char di kontainer, sehingga OAuth SAP AI
    # Core selalu gagal). Kunci yang butuh interpolasi/nilai turunan tetap di
    # `environment:` di bawah (precedence: environment menang atas env_file).
    env_file:
      - .env
      # Kunci AWS akun baru ada di berkas ini. Compose memakai berkas
      # BELAKANGAN sebagai pemenang → nilainya menimpa .env, sehingga kunci
      # baru tidak perlu masuk ke berkas yang di-track git.
      - secrets/aws-app.env
    environment:
      # Koneksi aplikasi. Bila `APP_DATABASE_URL` diisi di `.env`, aplikasi
      # memakai akun minimum (`mealchain_app_login`, Fase 11 butir 3) dan DSN
      # pemilik hanya dipakai migrasi lewat `MIGRATION_DATABASE_URL`. Kosong =
      # perilaku lama (role pemilik) supaya sesi lain tidak terkejut.
      DATABASE_URL: ${APP_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-mealchain}:${POSTGRES_PASSWORD:-mealchain_local}@postgres:5432/${POSTGRES_DB:-mealchain}}
      # DSN khusus migrasi/backup (role pemilik). Dipakai `backend/alembic/env.py`
      # lebih dulu daripada DATABASE_URL, sehingga `alembic upgrade head` tetap
      # berjalan sebagai role berwenang walau aplikasi sudah memakai akun minimum.
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      # `/` agar `import agent` menemukan mount ./agent:/agent (DEP-04). Aplikasi
      # sendiri tetap diimpor dari /app (cwd), jadi urutannya tidak mengubah apa pun.
      PYTHONPATH: /app:/
      DEMO_MODE: ${DEMO_MODE:-false}
      # Kunci kedua autofill layar login (27 Okt 2026). Default mati: endpoint
      # `/auth/demo-login` hanya mengirim sandi demo bila DEMO_MODE DAN flag ini
      # sama-sama aktif. Nyalakan hanya di mesin demo, jangan di instalasi nyata.
      DEMO_LOGIN_AUTOFILL: ${DEMO_LOGIN_AUTOFILL:-false}
      # Tujuh worker Agent (27 Okt 2026): `off` = murni deterministik,
      # `advisory` = model memperkaya ringkasan tanpa boleh mengubah status/blokir.
      WORKER_AGENT_MODE: ${WORKER_AGENT_MODE:-off}
      WORKER_AGENT_MODEL: ${WORKER_AGENT_MODEL:-}
      DEBUG: ${DEBUG:-false}
      # P4: review 7 worker agent — default MATI agar perilaku lama tidak berubah.
      MULTI_AGENT_REVIEW: ${MULTI_AGENT_REVIEW:-false}
      AGENT_REVIEW_MODE: ${AGENT_REVIEW_MODE:-advisory}
      AGENT_REVIEW_TIMEOUT_SECONDS: ${AGENT_REVIEW_TIMEOUT_SECONDS:-75}
      SAP_MATERIAL_STOCK_MODE: ${SAP_MATERIAL_STOCK_MODE:-mock}
      SAP_PURCHASE_ORDER_MODE: ${SAP_PURCHASE_ORDER_MODE:-mock}
      SAP_MATERIAL_DOCUMENT_MODE: ${SAP_MATERIAL_DOCUMENT_MODE:-mock}
      SAP_BUSINESS_PARTNER_MODE: ${SAP_BUSINESS_PARTNER_MODE:-mock}
      SAP_PRODUCT_MASTER_MODE: ${SAP_PRODUCT_MASTER_MODE:-mock}
      # Sprint 3 (S3-00 preflight): passthrough agent layer + auth dari .env
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
      # P3 integritas (S4-12): kunci ECDSA secp256k1 untuk tanda tangan dossier.
      # Nilai di .env; bila kosong → state `unsigned` jujur (bukan ttd palsu).
      SIGNING_KEY_HEX: ${SIGNING_KEY_HEX:-}
      INFERHUB_URL: ${INFERHUB_URL:-}
      INFERHUB_API_KEY: ${INFERHUB_API_KEY:-}
      SAP_AI_CORE_API_URL: ${SAP_AI_CORE_API_URL:-}
      SAP_AI_CORE_AUTH_URL: ${SAP_AI_CORE_AUTH_URL:-}
      SAP_AI_CORE_CLIENT_ID: ${SAP_AI_CORE_CLIENT_ID:-}
      SAP_AI_CORE_RESOURCE_GROUP: ${SAP_AI_CORE_RESOURCE_GROUP:-}
      SAP_AI_CORE_DEPLOYMENT_ID_LLM: ${SAP_AI_CORE_DEPLOYMENT_ID_LLM:-}
      SAP_AI_CORE_DEPLOYMENT_ID_RPT: ${SAP_AI_CORE_DEPLOYMENT_ID_RPT:-}
      # SAP_AI_CORE_CLIENT_SECRET TIDAK di sini: nilainya memuat `$` sehingga
      # interpolasi compose memotongnya. Diambil verbatim dari env_file di atas.
      SUPERVISOR_MODEL_PRIMARY: ${SUPERVISOR_MODEL_PRIMARY:-}
      SUPERVISOR_MODEL_FALLBACK: ${SUPERVISOR_MODEL_FALLBACK:-}
      SUPERVISOR_MODEL_FALLBACK_1: ${SUPERVISOR_MODEL_FALLBACK_1:-}
      SUPERVISOR_MODEL_FALLBACK_2: ${SUPERVISOR_MODEL_FALLBACK_2:-}
      SUPERVISOR_MODEL_FALLBACK_3: ${SUPERVISOR_MODEL_FALLBACK_3:-}
      SUPERVISOR_MODEL_FALLBACK_4: ${SUPERVISOR_MODEL_FALLBACK_4:-}
      SUPERVISOR_MODEL_FALLBACK_5: ${SUPERVISOR_MODEL_FALLBACK_5:-}
      SUPERVISOR_MODEL_FALLBACK_6: ${SUPERVISOR_MODEL_FALLBACK_6:-}
      SUPERVISOR_MODEL_FALLBACK_7: ${SUPERVISOR_MODEL_FALLBACK_7:-}
      SUPERVISOR_MODEL_FALLBACK_8: ${SUPERVISOR_MODEL_FALLBACK_8:-}
      SUPERVISOR_MODEL_FALLBACK_9: ${SUPERVISOR_MODEL_FALLBACK_9:-}
      SUPERVISOR_MODEL_FALLBACK_10: ${SUPERVISOR_MODEL_FALLBACK_10:-}
      SUPERVISOR_MODEL_FALLBACK_11: ${SUPERVISOR_MODEL_FALLBACK_11:-}
      VERIFIER_MODEL_PRIMARY: ${VERIFIER_MODEL_PRIMARY:-}
      VERIFIER_MODEL_FALLBACK_1: ${VERIFIER_MODEL_FALLBACK_1:-}
      VERIFIER_MODEL_FALLBACK_2: ${VERIFIER_MODEL_FALLBACK_2:-}
      VERIFIER_MODEL_FALLBACK_3: ${VERIFIER_MODEL_FALLBACK_3:-}
      VERIFIER_MODEL_FALLBACK_4: ${VERIFIER_MODEL_FALLBACK_4:-}
      VERIFIER_MODEL_FALLBACK_5: ${VERIFIER_MODEL_FALLBACK_5:-}
      VERIFIER_MODEL_FALLBACK_6: ${VERIFIER_MODEL_FALLBACK_6:-}
      VERIFIER_MODEL_FALLBACK_7: ${VERIFIER_MODEL_FALLBACK_7:-}
      VERIFIER_MODEL_FALLBACK_8: ${VERIFIER_MODEL_FALLBACK_8:-}
      VERIFIER_MODEL_FALLBACK_9: ${VERIFIER_MODEL_FALLBACK_9:-}
      FORECAST_MODEL: ${FORECAST_MODEL:-}
      FORECAST_MODEL_FALLBACK_1: ${FORECAST_MODEL_FALLBACK_1:-}
      FORECAST_MODEL_FALLBACK_2: ${FORECAST_MODEL_FALLBACK_2:-}
      FORECAST_MODEL_FALLBACK_3: ${FORECAST_MODEL_FALLBACK_3:-}
      FORECAST_MODEL_FALLBACK_4: ${FORECAST_MODEL_FALLBACK_4:-}
      FORECAST_MODEL_FALLBACK_5: ${FORECAST_MODEL_FALLBACK_5:-}
      FORECAST_MODEL_FALLBACK_6: ${FORECAST_MODEL_FALLBACK_6:-}
      FORECAST_MODEL_FALLBACK_7: ${FORECAST_MODEL_FALLBACK_7:-}
      FORECAST_MODEL_FALLBACK_8: ${FORECAST_MODEL_FALLBACK_8:-}
      FORECAST_MODEL_FALLBACK_9: ${FORECAST_MODEL_FALLBACK_9:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      # Seed sintetis read-only (Task 10) — jangan di-copy ke image
      - ./data:/data:ro
      # Paket agen: runtime TERPISAH (image sendiri, dideploy ke AgentCore),
      # tetapi 9 tes di backend/tests mengimpornya sebagai `agent`. Tanpa mount
      # ini pytest berhenti dengan ModuleNotFoundError (audit DEP-04). Read-only:
      # kontainer backend tidak boleh mengubah kode agen.
      - ./agent:/agent:ro
    # --reload sudah aktif dan TERBUKTI bekerja dari sisi host (uji 11 Okt:
    # GET /health berubah dalam 15 detik setelah berkas disunting dari Windows),
    # jadi TIDAK perlu WATCHFILES_FORCE_POLLING di sini. Cakupan pantau
    # dirapatkan ke paket app/ dan __pycache__ dikecualikan supaya penulisan
    # bytecode saat pytest tidak memicu reload beruntun.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app --reload-exclude "*__pycache__*"
    # Audit DEP-01: backend dulu tanpa healthcheck, jadi `docker compose ps`
    # hanya tahu "running" walau aplikasi belum siap menerima request.
    # Cek nyata ke /health (GET, tanpa auth) — bukan cek port.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - mealchain-network

  frontend:
    restart: unless-stopped
    # Nama image dipisah dari image produksi: Dockerfile punya dua target
    # (dev/runner) dan `build` keduanya tidak boleh saling menimpa.
    image: mealchain-frontend-dev:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Target `dev` (bukan `runner`): stack ini untuk kerja harian — `next dev`
      # + bind mount. Image produksi (`next build` + `next start`) dibangun oleh
      # `docker-compose.prod.yml` (audit DEP-01).
      target: dev
    container_name: mealchain-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
      # Dev experience (arah Roy 2026-10-11): bind mount dari drive E: (exFAT)
      # tidak meneruskan notifikasi perubahan berkas ke kontainer, jadi watcher
      # webpack Next tidak pernah tahu berkas disunting — edit dari Kiro/Hermes
      # dulu hanya terpakai setelah `docker compose restart frontend` (terukur:
      # 75 detik menunggu, 0 baris kompilasi di log). Polling membuat Next
      # memeriksa berkas berkala sehingga edit langsung terpakai.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    healthcheck:
      # GET sungguhan, bukan cek port: `next dev` sudah menerima koneksi saat kompilasi
      # belum selesai, jadi cek TCP akan bilang "sehat" padahal halaman belum tersaji.
      # `wget -q -O /dev/null` = BusyBox wget di node:20-alpine (terverifikasi exit 0).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 10s
      retries: 5
      # kompilasi pertama di bind mount exFAT bisa ~40 s; jangan dihitung sebagai gagal
      start_period: 120s
    networks:
      - mealchain-network

  mock-sap:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mealchain-mock-sap
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mealchain}:${POSTGRES_PASSWORD:-mealchain_local}@postgres:5432/${POSTGRES_DB:-mealchain}
      DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - "${MOCK_SAP_PORT:-8001}:8001"
    volumes:
      - ./backend:/app
    command: uvicorn app.sap_integration.mock_service:app --host 0.0.0.0 --port 8001
    networks:
      - mealchain-network

volumes:
  postgres_data:

networks:
  mealchain-network:
    driver: bridge
