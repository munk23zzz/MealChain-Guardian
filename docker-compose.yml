version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mealchain-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mealchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mealchain_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mealchain_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mealchain} -d ${POSTGRES_DB:-mealchain_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mealchain-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mealchain-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mealchain}:${POSTGRES_PASSWORD:-mealchain_secret}@postgres:5432/${POSTGRES_DB:-mealchain_db}
      SAP_MODE: ${SAP_MODE:-mock}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - mealchain-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mealchain-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - mealchain-network

volumes:
  postgres_data:

networks:
  mealchain-network:
    driver: bridge
