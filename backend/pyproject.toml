[project]
name = "mealchain-guardian"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: test/probe yang memanggil model provider NYATA (Bedrock/Inferhub) — jalankan eksplisit: pytest -m live",
]
