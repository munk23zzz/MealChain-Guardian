# Stack produksi MealChain Guardian (audit DEP-01, 2026-10-24).
#
# Bedanya dengan `docker-compose.yml` (stack kerja harian):
#   - frontend: image target `runner` → `next build` + `next start`, TANPA bind
#     mount dan tanpa `npm run dev`. Halaman tidak dikompilasi per request.
#   - backend: tanpa `--reload` dan tanpa bind mount → kode dari image.
#   - healthcheck aktif untuk postgres, backend, dan frontend; frontend baru
#     dinyalakan setelah backend benar-benar sehat.
#   - nama kontainer, volume, dan jaringan diberi akhiran `-prod` supaya stack
#     ini bisa hidup berdampingan dengan stack dev di mesin yang sama.
#
# Pakai:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml ps          # semua harus "healthy"
#
# Catatan data: volume `postgres_prod_data` TERPISAH dari stack dev, jadi DB
# produksi mulai kosong dan perlu disemai sekali:
#   docker compose -f docker-compose.prod.yml exec backend python -m app.seed.seed_data
#
# UI produksi memakai jalur relatif (`NEXT_PUBLIC_API_URL=""`) sehingga request
# API diteruskan Next ke `http://backend:8000` di jaringan compose — satu origin,
# tanpa CORS dan tanpa membuka port 8000 ke publik.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: mealchain-prod-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mealchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mealchain_local}
      POSTGRES_DB: ${POSTGRES_DB:-mealchain}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mealchain} -d ${POSTGRES_DB:-mealchain}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mealchain-prod-network

  backend:
    restart: unless-stopped
    image: mealchain-backend-prod:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mealchain-prod-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
      - secrets/aws-app.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mealchain}:${POSTGRES_PASSWORD:-mealchain_local}@postgres:5432/${POSTGRES_DB:-mealchain}
      DEBUG: "false"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Seed sintetis read-only; kode TIDAK di-mount (berbeda dari stack dev).
      - ./data:/data:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - mealchain-prod-network

  frontend:
    restart: unless-stopped
    # Nama image dipisah dari stack dev supaya `build` di sini tidak menimpa
    # image dev (dua target berbeda dari Dockerfile yang sama).
    image: mealchain-frontend-prod:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Inilah perbaikannya: image produksi, bukan dev server.
      target: runner
    container_name: mealchain-prod-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Kosong = UI memanggil path relatif, Next meneruskan ke backend:8000.
      NEXT_PUBLIC_API_URL: ""
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3010}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 10s
      retries: 5
      # `next start` menyajikan halaman siap pakai; tidak perlu 120 dtk seperti dev.
      start_period: 30s
    networks:
      - mealchain-prod-network

  mock-sap:
    restart: unless-stopped
    image: mealchain-mock-sap-prod:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mealchain-prod-mock-sap
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mealchain}:${POSTGRES_PASSWORD:-mealchain_local}@postgres:5432/${POSTGRES_DB:-mealchain}
      DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - "${MOCK_SAP_PORT:-8001}:8001"
    command: uvicorn app.sap_integration.mock_service:app --host 0.0.0.0 --port 8001
    networks:
      - mealchain-prod-network

volumes:
  postgres_prod_data:

networks:
  mealchain-prod-network:
    driver: bridge
