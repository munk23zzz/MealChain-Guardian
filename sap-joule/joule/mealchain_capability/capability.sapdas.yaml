# Root capability: metadata + peta alias sistem -> BTP Destination.
#
# Wajib:
#   * schema_version >= 3.28.0  (action `agent-request` belum ada di versi bawah)
#   * namespace: joule.ext      (namespace lain dianggap milik SAP internal dan ditolak saat deploy)
schema_version: 3.28.0

metadata:
  namespace: joule.ext
  name: mealchain_capability
  version: 1.1.0
  display_name: MealChain_Guardian
  description: >-
    Melihat situasi pasokan SPPG, indikator kinerja, dan antrean usulan keputusan
    MealChain Guardian. Baca-saja: persetujuan tetap dilakukan manusia di UI MealChain.

system_aliases:
  # Kunci alias (MEALCHAIN_AGENT) dipakai di functions/*.yaml.
  # Nilai `destination` HARUS sama dengan nama BTP Destination yang menunjuk jembatan A2A kita.
  #
  # NILAI KANONIK = `MEALCHAIN_AGENT_01` (diukur 11 & 18 Okt 2026).
  # `SWZ_JOULE` BUKAN endpoint A2A: ia milik panitia dan menunjuk
  # https://aws-sap-hackathon-si4ykj9d.ap10.sapdas.cloud.sap — `POST /` di sana 401 dan
  # `/.well-known/agent-card.json` 400. Deploy baru yang memakai SWZ_JOULE menghasilkan
  # "Something went wrong" di chat (JCore - 5802), persis gejala 18 Okt 2026.
  #
  # Daftar destination subaccount saat ini (Destination Configuration API):
  #   MEALCHAIN_AGENT_01 -> https://mealchain-joule-bridge-4sehat3trio.cfapps.ap10.hana.ondemand.com
  #   SWZ_JOULE          -> https://aws-sap-hackathon-si4ykj9d.ap10.sapdas.cloud.sap (bukan A2A)
  MEALCHAIN_AGENT:
    destination: MEALCHAIN_AGENT_01
