# Publikasi UI MealChain Guardian ke GitHub Pages sebagai DEMO STATIS.
#
# Halaman ini UI asli dari branch `main`, diekspor statis (output: "export") dan
# memakai data fixture: `public/mock/api-<peran>.json` yang direkam dari API
# sungguhan (scripts/rekam_fixture_demo.py). Konsekuensinya:
#   * tidak ada API yang perlu hidup — halaman jalan tanpa backend;
#   * aksi tulis (approve/execute) dijawab sukses tapi TIDAK mengubah data;
#   * data hanya seakurat rekaman terakhir: rekam ulang + build ulang bila data
#     demo berubah.
# Aplikasi dengan API sungguhan tetap ada di branch yang sama (jalankan lokal
# atau di server dengan `docker compose up -d`).
name: Deploy UI ke GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # DEMO STATIS: UI tidak memanggil API sama sekali. Semua data dijawab berkas
  # `public/mock/api-<peran>.json` (direkam dari API sungguhan oleh
  # scripts/rekam_fixture_demo.py). Tidak ada server, tidak ada CORS, tidak ada
  # ketergantungan pada mesin demo yang menyala.
  NEXT_PUBLIC_USE_MOCK: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Build ekspor statis
        working-directory: frontend
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: /MealChain-Guardian
        run: npm run build

      - name: Pastikan rute penting benar-benar terekspor
        working-directory: frontend
        run: |
          set -euo pipefail
          for path in out/index.html out/404.html; do
            test -f "$path" || { echo "HILANG: $path"; exit 1; }
            echo "ok $path"
          done

      - name: .nojekyll (Pages tidak boleh memproses folder _next/)
        working-directory: frontend
        run: touch out/.nojekyll

      - name: Konfigurasi Pages
        uses: actions/configure-pages@v5

      - name: Unggah artefak
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
