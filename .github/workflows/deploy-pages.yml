# Publikasi UI MealChain Guardian (kode kerja, satu halaman konsol) ke GitHub Pages.
#
# Halaman ini UI asli dari branch `main` — diekspor statis (output: "export"),
# jadi tidak ada server Next di Pages. Yang perlu dipahami:
#   * Semua panel mengambil data dari API sungguhan lewat NEXT_PUBLIC_API_URL
#     (backend FastAPI). Nilai URL itu DIPAKU saat build, jadi kalau alamat API
#     berubah, workflow ini harus dijalankan ulang dengan nilai baru.
#   * Backend harus mengizinkan origin https://munk23zzz.github.io di CORS_ORIGINS.
#   * rewrites()/headers() Next tidak dipakai di mode ekspor (lihat next.config.js).
name: Deploy UI ke GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Alamat API publik yang dipanggil UI dari browser. Nilai ini tetap (Tailscale
  # Funnel di mesin demo: port 443 → backend:8000). Ganti hanya bila mesin/URL
  # berubah, lalu jalankan ulang workflow.
  NEXT_PUBLIC_API_URL: https://mealchain-guardian.tailda91db.ts.net

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Build ekspor statis
        working-directory: frontend
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: /MealChain-Guardian
        run: npm run build

      - name: Pastikan rute penting benar-benar terekspor
        working-directory: frontend
        run: |
          set -euo pipefail
          for path in out/index.html out/404.html; do
            test -f "$path" || { echo "HILANG: $path"; exit 1; }
            echo "ok $path"
          done

      - name: .nojekyll (Pages tidak boleh memproses folder _next/)
        working-directory: frontend
        run: touch out/.nojekyll

      - name: Konfigurasi Pages
        uses: actions/configure-pages@v5

      - name: Unggah artefak
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
